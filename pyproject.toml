[project]
name = "fastapi-project-template"
version = "0.1.0"
description = "Microservice-ready FastAPI template: auth, users, roles, generic CRUD, pluggable task backend, AI-extension points."
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
dependencies = [
  "fastapi[standard]>=0.162.0",
  "uvicorn[standard]>=0.54.0",
  "sqlalchemy[asyncio]>=2.1.8",
  "asyncpg>=0.32.0",
  "alembic>=1.20.1",
  "pydantic>=2.14.3",
  "pydantic-settings>=2.16.2",
  "pyjwt[crypto]>=2.15.1",
  "pwdlib[argon2]>=0.3.1",
  "structlog>=26.1.0",
  "redis>=8.1.0",
  "httpx>=0.28.1",
  "greenlet>=3.5.6",
]

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1",
  "pytest-cov>=7.1.0",
  "aiosqlite>=0.22.1",
  "ruff>=0.17.4",
  "mypy>=2.4.1",
]
# Install with `uv sync --group workers` when you turn on a real queue.
workers = [
  # "celery[redis]>=5.5",
  # "arq>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py315"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.15"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::RuntimeWarning"]
